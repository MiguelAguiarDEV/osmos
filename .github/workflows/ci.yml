name: ci
on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # debe cubrir el `go 1.23` declarado en go.work
          go-version: "1.24.x"
          cache: true

      - name: Workspace sync
        run: go work sync

      - name: gofmt
        run: make fmt-check

      - name: Vet
        run: make vet

      # los tests del CLI existían pero nunca se ejecutaban en CI
      - name: Test (race)
        run: make race

      - name: Build
        run: make build

      - name: CLI smoke
        run: |
          ./bin/cli --version
          ./bin/cli --help 2>&1 | head -20
