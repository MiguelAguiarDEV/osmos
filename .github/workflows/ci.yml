name: ci
on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true

      - name: Workspace sync
        run: go work sync

      # Lint + tests por módulo (con detector de carreras)
      - name: Vet server
        run: go -C server vet ./...
      - name: Test server
        run: go -C server test ./... -race

      - name: Vet cli
        run: go -C clients/cli vet ./...
      - name: Test cli
        run: go -C clients/cli test ./... -race

      # Builds
      - name: Build server
        run: go -C server build -o ../bin/server ./cmd/server
      - name: Build cli
        run: go -C clients/cli build -o ../../bin/cli .

      # Smoke del CLI
      - name: CLI --help
        run: ./bin/cli --help
